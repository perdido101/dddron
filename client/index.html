<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUZZKILL</title>
    <link rel="icon" href="data:," />
    <style>
      /*
        Fredoka (SIL Open Font License 1.1), the manifest's P0 "heavy rounded
        sans". Self-hosted rather than linked from Google's CDN: a party game
        opened from a shared link should not have its type fall apart because
        a network blocks fonts.googleapis.com, and one request we control
        beats two we do not. Latin subset only, one variable file, 29 kB.

        `swap` so the UI is readable immediately and simply restyles when the
        font lands, instead of showing nothing for a beat.
      */
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('./fonts/fredoka-latin.woff2') format('woff2');
      }
      :root {
        color-scheme: light;
        /* Rounded sans for anything a player reads. */
        font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
        /* Monospace stays where columns have to line up: the debug overlay,
           the metrics table and the FPV telemetry are all read as figures. */
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe4f2;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #debug {
        font-family: var(--mono);
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(24, 30, 38, 0.72);
        color: #e9f4ff;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre;
        pointer-events: none;
        z-index: 10;
      }
      #debug[hidden] {
        display: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(24, 30, 38, 0.68);
        color: #e9f4ff;
        font-size: 12px;
        letter-spacing: 0.02em;
        pointer-events: none;
        z-index: 10;
        transition: opacity 0.25s ease;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 260px;
        padding: 10px 16px 12px;
        border-radius: 12px;
        background: rgba(24, 30, 38, 0.72);
        color: #eef6ff;
        text-align: center;
        pointer-events: none;
        z-index: 12;
      }
      .hud-label {
        font-size: 10px;
        letter-spacing: 0.22em;
        opacity: 0.72;
      }
      .hud-readout {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .hud-track {
        height: 8px;
        margin: 4px 0 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      .hud-bar {
        height: 100%;
        width: 100%;
        border-radius: 99px;
        transition: width 0.12s linear, background 0.3s ease;
      }
      .hud-status {
        font-size: 11px;
        opacity: 0.82;
        font-variant-numeric: tabular-nums;
      }
      #hud-warning {
        position: fixed;
        top: 130px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        padding: 8px 20px;
        border-radius: 8px;
        background: #ff4d5e;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.16em;
        pointer-events: none;
        z-index: 12;
      }
      #fpv {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 11;
        color: #dff6ff;
        font-family: var(--mono);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .fpv-corner {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 2px solid rgba(223, 246, 255, 0.65);
      }
      .fpv-corner.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; }
      .fpv-corner.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; }
      .fpv-corner.bl { bottom: 22px; left: 22px; border-right: 0; border-top: 0; }
      .fpv-corner.br { bottom: 22px; right: 22px; border-left: 0; border-top: 0; }
      .fpv-battery { position: absolute; top: 34px; left: 40px; line-height: 1; }
      .fpv-batt-value { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .fpv-batt-value.critical { color: #ff6070; animation: fpvflash 0.35s steps(2, end) infinite; }
      .fpv-batt-label { font-size: 11px; letter-spacing: 0.24em; opacity: 0.75; margin-left: 6px; }
      .fpv-right { position: absolute; top: 34px; right: 40px; text-align: right; font-size: 13px; }
      .fpv-rec { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-bottom: 6px; }
      .fpv-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff4d5e; animation: fpvflash 1s ease-in-out infinite; }
      .fpv-alt, .fpv-spd { font-variant-numeric: tabular-nums; opacity: 0.9; }
      .fpv-horizon { position: absolute; top: 50%; left: 50%; width: 220px; height: 2px; transform: translate(-50%, -50%); }
      .fpv-horizon i { position: absolute; top: 50%; left: 50%; display: block; width: 220px; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(223, 246, 255, 0.75) 20%, rgba(223, 246, 255, 0.75) 80%, transparent); }
      .fpv-crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%);
        border: 1px solid rgba(223, 246, 255, 0.55); border-radius: 50%; }
      .fpv-lowpower { position: absolute; top: 96px; left: 40px; display: none; padding: 3px 10px;
        background: #ff4d5e; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; }
      @keyframes fpvflash { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.25; } }
      #hud-objective {
        position: fixed;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        width: 300px;
        padding: 8px 14px 10px;
        border-radius: 10px;
        background: rgba(24, 30, 38, 0.72);
        color: #eef6ff;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-align: center;
        pointer-events: none;
        z-index: 12;
      }
      .hud-obj-bar {
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: #9ba8f0;
        transition: width 0.15s linear;
      }
      #hud-prompt {
        position: fixed;
        left: 50%;
        bottom: 130px;
        transform: translateX(-50%);
        display: none;
        padding: 7px 16px;
        border-radius: 99px;
        color: #fff;
        font-size: 12px;
        letter-spacing: 0.06em;
        pointer-events: none;
        z-index: 12;
      }
      #hud-flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 30;
      }
      #hud-victory {
        position: fixed;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        padding: 14px 34px;
        border-radius: 12px;
        background: rgba(155, 168, 240, 0.95);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        pointer-events: none;
        z-index: 31;
      }
      #lobby {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 27, 34, 0.82);
        backdrop-filter: blur(3px);
        z-index: 40;
      }
      .lobby-card {
        width: 330px;
        padding: 26px 28px 30px;
        border-radius: 16px;
        background: #f4f7fb;
        color: #223;
        text-align: center;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .lobby-card h1 {
        margin: 0 0 2px;
        font-size: 34px;
        letter-spacing: 0.12em;
      }
      .lobby-sub {
        margin: 0 0 16px;
        font-size: 10px;
        letter-spacing: 0.2em;
        opacity: 0.6;
      }
      .lobby-card input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 9px;
        border: 2px solid #ccd6e2;
        border-radius: 9px;
        font: inherit;
        font-size: 14px;
        text-align: center;
        box-sizing: border-box;
      }
      .lobby-card button {
        width: 100%;
        padding: 11px;
        margin-bottom: 8px;
        border: 0;
        border-radius: 9px;
        background: #7fd4a8;
        color: #12301f;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        cursor: pointer;
      }
      .lobby-card button:disabled { background: #ccd6e2; color: #7d8b99; cursor: not-allowed; }
      .lobby-card button.lobby-solo { background: transparent; color: #5a6b7d; font-weight: 400; letter-spacing: 0; }
      .lobby-join { display: flex; gap: 8px; }
      .lobby-join input { flex: 1; letter-spacing: 0.3em; font-weight: 700; }
      .lobby-join button { flex: 0 0 88px; background: #9ba8f0; color: #1a1f3d; }
      .lobby-codelabel { letter-spacing: 0.34em; font-size: 40px; }
      .lobby-players, .lobby-scores {
        list-style: none;
        margin: 0 0 14px;
        padding: 0;
        font-size: 13px;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      .lobby-players li, .lobby-scores li { padding: 4px 0; border-bottom: 1px solid #e3e9f0; }
      .lobby-hint, .lobby-status, .lobby-awards { margin: 6px 0 0; font-size: 11px; opacity: 0.65; }
      /* Setup block: practice toggle, role picker and bot count. Laid out as
         label + control rows so it reads as settings rather than more buttons. */
      .lobby-setup {
        margin: 0 0 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #e8eef6;
        text-align: left;
      }
      .lobby-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      .lobby-row:last-child { margin-bottom: 0; }
      .lobby-row > span { flex: 1; }
      .lobby-row button {
        width: auto;
        min-width: 34px;
        margin: 0;
        padding: 6px 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        background: #ccd6e2;
        color: #435060;
      }
      .lobby-row button[data-on='1'] { background: #7fd4a8; color: #12301f; }
      .lobby-botcount { min-width: 18px; text-align: center; font-weight: 700; opacity: 1; }
      .lobby-result-cause { margin: 0 0 14px; font-size: 12px; opacity: 0.7; }
      /* Dev console (handoff 02, session 4). Never present in a production
         build — main.ts does not construct it unless dev tools are enabled. */
      #devconsole {
        font-family: var(--mono);
        position: fixed;
        top: 12px;
        right: 12px;
        width: 300px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(18, 22, 28, 0.93);
        color: #dfe7ef;
        font-size: 11px;
        line-height: 1.5;
        z-index: 45;
      }
      .dev-title { font-weight: 700; letter-spacing: 0.14em; margin-bottom: 8px; }
      .dev-note { font-weight: 400; letter-spacing: 0; opacity: 0.6; }
      .dev-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 5px; }
      .dev-group > span {
        flex: 0 0 56px;
        opacity: 0.55;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #devconsole button {
        padding: 4px 8px;
        border: 0;
        border-radius: 6px;
        background: #33414f;
        color: #dfe7ef;
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }
      #devconsole button:hover { background: #46586a; }
      .dev-constants {
        margin: 10px 0 6px;
        padding-top: 8px;
        border-top: 1px solid #33414f;
        font-size: 10px;
        line-height: 1.45;
        opacity: 0.62;
        white-space: pre;
        overflow-x: auto;
      }
      .dev-readout { min-height: 14px; color: #7fd4a8; }
      /* Round metrics (handoff 02, session 3). Dev-only, like the console. */
      #roundsummary {
        font-family: var(--mono);
        position: fixed;
        top: 12px;
        left: 12px;
        width: 330px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(18, 22, 28, 0.94);
        color: #dfe7ef;
        font-size: 11px;
        z-index: 46;
      }
      .rs-title { font-weight: 700; letter-spacing: 0.14em; margin-bottom: 8px; }
      .rs-count { font-weight: 400; letter-spacing: 0; opacity: 0.55; }
      .rs-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .rs-table th {
        text-align: left;
        font-weight: 400;
        opacity: 0.55;
        padding: 2px 0;
      }
      .rs-table td { text-align: right; padding: 2px 0; }
      .rs-share { width: 42px; opacity: 0.5; }
      .rs-actions { display: flex; gap: 6px; margin-top: 10px; }
      #roundsummary button {
        flex: 1;
        padding: 5px;
        border: 0;
        border-radius: 6px;
        background: #33414f;
        color: #dfe7ef;
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      #roundsummary button:hover { background: #46586a; }
      .rs-note { margin-top: 6px; min-height: 13px; color: #7fd4a8; font-size: 10px; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #bfe4f2;
        color: #2c3a45;
        font-size: 13px;
        letter-spacing: 0.18em;
        z-index: 20;
      }
      #boot[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">BUZZKILL — LOADING PHYSICS…</div>
    <div id="debug" hidden></div>
    <div id="hint">click to look · WASD move · SPACE jump · ~ debug · O orbit cam</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
